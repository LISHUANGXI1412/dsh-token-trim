name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # DSH desktop runs on Windows; the transform tests assert Windows paths too.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        shell: cmd
        run: npm.cmd install -g "npm@^11"

      - name: Validate package
        shell: cmd
        run: |
          node --check index.js
          node --check index-host.js
          node --check client/panel.js
          node test/run.mjs
          node test/cross-agent.mjs
          node test/replay.mjs
          node test/rework.mjs
          node test/policy.mjs
          node tools/panel-smoke.mjs
          npm.cmd pack --dry-run

      - name: Publish to npm
        shell: cmd
        run: npm.cmd publish --access public --provenance
